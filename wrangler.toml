# Cloudflare deployment. The site is static — no Worker script — so `main` is
# intentionally absent and `wrangler deploy` just uploads ./dist.
#
# The VITE_* variables are NOT set here, and they are not Worker runtime
# variables either: Vite compiles them into the bundle at build time. So they
# come from whichever machine runs `npm run build` — the dashboard's *Build*
# variables when Cloudflare builds from GitHub (how this site is deployed), or
# your local .env if you ever deploy by hand. See DEPLOY.md.

# Must match the Worker Cloudflare created when the GitHub repo was connected.
name = "tango-menu-ci"
compatibility_date = "2026-09-08"

# Kept on as a second address: https://tango-menu-ci.ahmadmoussa680.workers.dev
workers_dev = true

# The domain is attached here rather than in the dashboard, so this file is the
# one source of truth and every deploy re-attaches it. It needs the zone to be
# Active in this Cloudflare account — a route to a missing or pending zone fails
# the whole deploy ("Could not find zone"). Cloudflare creates the DNS records
# and HTTPS certificates for both hostnames itself.
routes = [
  { pattern = "tango-sanpedro.com", custom_domain = true },
  { pattern = "www.tango-sanpedro.com", custom_domain = true }
]

[assets]
directory = "./dist"
# Hash routing means #/staff never reaches the server, but this keeps any
# stray deep link returning the app instead of a 404.
not_found_handling = "single-page-application"
